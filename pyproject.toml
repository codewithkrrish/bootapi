[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bootapi"
version = "0.1.0"
description = "A FastAPI starter template with JWT auth, settings and tests — clone it and ship an API the same day."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",  # needed for the OAuth2 login form
    "email-validator>=2.0",  # needed for pydantic's EmailStr
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
bootapi = "app.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
